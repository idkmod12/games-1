<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game data reset</title><style>html,body{margin:0;min-height:100%;background:#000;color:#f2f2f4;font:16px system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(560px,100%);border:1px solid #2a2a32;border-radius:16px;background:#111113;padding:30px;box-sizing:border-box}.mark{color:#ff3b3b;font-size:12px;letter-spacing:2px}.card h1{margin:8px 0 10px}.card p{color:#aaaab6;line-height:1.55}.done{color:#77e39a;font-weight:600}</style></head><body><main><section class="card"><div class="mark">ISAIAH'S MLV</div><h1>Resetting game data…</h1><p id="status">Clearing data saved by this browser on this game host.</p></section></main><script>
(async()=>{const s=document.getElementById('status');let steps=[];try{localStorage.clear();steps.push('local storage');}catch{}try{sessionStorage.clear();steps.push('session storage');}catch{}try{for(const part of document.cookie.split(';')){const name=part.split('=')[0].trim();if(name)document.cookie=name+'=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';}steps.push('cookies');}catch{}try{if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));steps.push('cached files');}}catch{}try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));steps.push('service workers');}}catch{}try{if(indexedDB.databases){const dbs=await indexedDB.databases();await Promise.all(dbs.filter(d=>d.name).map(d=>new Promise(resolve=>{const req=indexedDB.deleteDatabase(d.name);req.onsuccess=req.onerror=req.onblocked=()=>resolve();})));steps.push('database saves');}}catch{}s.className='done';s.textContent='Game data was cleared for this browser on this host. You can close this tab.';document.querySelector('h1').textContent='Game data reset';})();
</script></body></html>
