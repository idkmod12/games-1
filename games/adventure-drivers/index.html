<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Adventure Drivers</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#73d5e5;touch-action:none;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:#001b2dcc;color:#fff;font-size:13px;pointer-events:none;white-space:nowrap}</style></head><body><canvas id="game"></canvas><div id="hint">Hold ▶ or press W / ↑ to drive</div><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),hint=document.getElementById('hint');let W,H,dpr,car={x:110,y:0,vx:0,vy:0,angle:0},keys={},coins=[],dist=0,best=+(localStorage.getItem('adventure-drivers-best')||0),touch={left:false,right:false,gas:false};function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function down(k){keys[k]=true}function up(k){keys[k]=false}addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});let pd; c.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY};});c.addEventListener('pointerup',e=>{if(pd){const dx=e.clientX-pd.x,dy=e.clientY-pd.y;if(Math.abs(dx)>20){touch[dx>0?'right':'left']=true;setTimeout(()=>touch[dx>0?'right':'left']=false,180)}else if(dy<0){touch.gas=true;setTimeout(()=>touch.gas=false,280)}pd=null}});function loop(){const ground=H*.74,gas=keys['w']||keys['arrowup']||keys[' ']||touch.gas,left=keys['a']||keys['arrowleft']||touch.left,right=keys['d']||keys['arrowright']||touch.right;car.vx+=(gas?.16:-.025);car.vx*=.985;car.vx=Math.max(0,Math.min(11,car.vx));if(left)car.angle-=.045;if(right)car.angle+=.045;car.angle*=.98;car.vy+=.45;car.y+=car.vy;if(car.y>ground-38){car.y=ground-38;car.vy=0;car.angle*=.88}dist+=car.vx*.08;if(dist>best){best=Math.floor(dist);localStorage.setItem('adventure-drivers-best',best)}if(Math.random()<.025)coins.push({x:W+30,y:ground-80-Math.random()*90});coins.forEach(o=>o.x-=car.vx+3);coins=coins.filter(o=>o.x>-30);g.clearRect(0,0,W,H);g.fillStyle='#74d9e8';g.fillRect(0,0,W,H);g.fillStyle='#c9f2f5';for(let i=0;i<7;i++){g.beginPath();g.arc((i*190-(dist*3)%190),120+(i%3)*45,34,0,Math.PI*2);g.fill()}g.fillStyle='#41a94f';g.fillRect(0,ground,W,H-ground);g.fillStyle='#2f873d';for(let i=0;i<18;i++)g.fillRect(i*90-(dist*6)%90,ground+25,45,5);coins.forEach(o=>{g.fillStyle='#ffd34e';g.beginPath();g.arc(o.x,o.y,12,0,Math.PI*2);g.fill();g.fillStyle='#9a6310';g.font='bold 13px system-ui';g.textAlign='center';g.fillText('$',o.x,o.y+5)});g.save();g.translate(car.x,car.y);g.rotate(car.angle);g.fillStyle='#ef5a45';g.fillRect(-42,-20,84,30);g.fillStyle='#ffd15a';g.fillRect(-20,-38,39,20);g.fillStyle='#18262b';g.beginPath();g.arc(-25,15,13,0,Math.PI*2);g.arc(25,15,13,0,Math.PI*2);g.fill();g.restore();g.fillStyle='#fff';g.font='700 18px system-ui';g.textAlign='left';g.fillText('DISTANCE '+Math.floor(dist),18,30);g.textAlign='right';g.fillText('BEST '+best,W-18,30);requestAnimationFrame(loop)}loop()})();</script></body></html>
